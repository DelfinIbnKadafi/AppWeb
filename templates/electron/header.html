<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 40px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 6px; padding: 0 8px;
    background: #1b1e26; color: #e8eaf0;
    font: 13px "Segoe UI", system-ui, sans-serif; user-select: none;
  }
  button {
    border: 0; border-radius: 6px; background: transparent; color: inherit;
    height: 28px; min-width: 28px; padding: 0 8px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #2b303c; }
  button:disabled { opacity: .35; cursor: default; }
  #title { flex: 1; min-width: 0; padding: 0 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #copy { background: #2b303c; }
  #zoom { font-size: 12px; color: #9aa3b5; }
</style>
</head>
<body>
  <button id="back" title="Back">&#8592;</button>
  <button id="forward" title="Forward">&#8594;</button>
  <button id="reload" title="Reload">&#8635;</button>
  <div id="title"></div>
  <button id="zoom" title="Reset zoom" hidden></button>
  <button id="copy">Copy URL</button>
<script>
  const $ = (id) => document.getElementById(id);

  $("back").onclick = () => window.appweb.nav("back");
  $("forward").onclick = () => window.appweb.nav("forward");
  $("reload").onclick = () => window.appweb.nav("reload");
  $("zoom").onclick = () => window.appweb.nav("zoom-reset");

  $("copy").onclick = () => {
    window.appweb.copyUrl();
    const b = $("copy");
    b.textContent = "Copied!";
    setTimeout(() => (b.textContent = "Copy URL"), 1200);
  };

  window.appweb.onState((s) => {
    $("title").textContent = s.title;
    $("title").title = s.title;
    $("back").disabled = !s.canBack;
    $("forward").disabled = !s.canForward;
    // only show zoom badge when it is not 100%
    const z = Math.round(s.zoom * 100);
    $("zoom").hidden = z === 100;
    $("zoom").textContent = z + "%";
  });
</script>
</body>
</html>
